AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  n5528712 CAB432 A3 - compute and load distribution: ALB (forwards only requests carrying the
  CloudFront secret header), ECS Fargate game service in private subnets with Service Auto Scaling,
  and the ALB route to the leaderboard API Lambda.
  Account constraints (explicit IAM denies for the student role) shape this template:
   - no iam:CreateRole            -> pre-provisioned CAB432 ECS/Lambda roles
   - no ec2:CreateSecurityGroup   -> shared CAB432SG; tasks isolated in private subnets (no public IP)
   - no acm:RequestCertificate    -> HTTP listener; viewers still use HTTPS/WSS at CloudFront
   - no logs:DeleteLogGroup       -> log groups created by infra/scripts/ensure-log-groups.sh
   - lambda:GetFunction denied on not-yet-existing functions (breaks the CloudFormation Lambda
     handler)                      -> functions + SQS mapping managed by infra/scripts/deploy-lambdas.sh

Parameters:
  Prefix: { Type: String, Default: n5528712-a3 }
  QutUsername: { Type: String, Default: n5528712@qut.edu.au }
  VpcId: { Type: AWS::EC2::VPC::Id }
  PublicSubnets: { Type: 'List<AWS::EC2::Subnet::Id>', Description: ALB subnets (one per AZ) }
  PrivateSubnets: { Type: 'List<AWS::EC2::Subnet::Id>', Description: Task subnets (egress via the account NAT) }
  SecurityGroupId: { Type: 'AWS::EC2::SecurityGroup::Id', Description: Pre-existing CAB432SG (students cannot create SGs) }
  GameLogGroupName: { Type: String }
  OriginVerifySecret: { Type: String, NoEcho: true, Description: Header value only CloudFront knows }
  ImageUri: { Type: String }
  ApiFunctionArn: { Type: String, Description: Leaderboard API Lambda (created by infra/scripts/deploy-lambdas.sh) }
  ExecutionRoleArn: { Type: String, Default: 'arn:aws:iam::901444280953:role/Execution-Role-CAB432-ECS' }
  TaskRoleArn: { Type: String, Default: 'arn:aws:iam::901444280953:role/Task-Role-CAB432-ECS' }
  TaskCpu: { Type: String, Default: '256' }
  TaskMemory: { Type: String, Default: '512' }
  MinTasks: { Type: Number, Default: 1 }
  MaxTasks: { Type: Number, Default: 6 }
  CpuTarget: { Type: Number, Default: 50 }
  OccupancyTarget: { Type: Number, Default: 75 }

Resources:
  # ---------------------------------------------------------------- load balancer
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${Prefix}-alb'
      Scheme: internet-facing
      Type: application
      Subnets: !Ref PublicSubnets
      SecurityGroups: [!Ref SecurityGroupId]
      LoadBalancerAttributes:
        - { Key: idle_timeout.timeout_seconds, Value: '120' }
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true' }
      Tags:
        - { Key: purpose, Value: assessment 3 }
        - { Key: qut-username, Value: !Ref QutUsername }

  GameTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${Prefix}-game-tg'
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      VpcId: !Ref VpcId
      HealthCheckPath: /ready
      HealthCheckIntervalSeconds: 10
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '15' }
        - { Key: load_balancing.algorithm.type, Value: round_robin }
      Tags:
        - { Key: purpose, Value: assessment 3 }
        - { Key: qut-username, Value: !Ref QutUsername }

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${Prefix}-api-tg'
      TargetType: lambda
      Targets: [{ Id: !Ref ApiFunctionArn }]
      Tags:
        - { Key: purpose, Value: assessment 3 }
        - { Key: qut-username, Value: !Ref QutUsername }

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig: { StatusCode: '403', ContentType: text/plain, MessageBody: forbidden }

  # Requests must carry the secret header CloudFront adds; anything else (e.g. someone hitting the
  # ALB DNS name directly) gets the 403 default. This replaces an SG restricted to CloudFront IPs.
  ApiRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 10
      Conditions:
        - Field: http-header
          HttpHeaderConfig: { HttpHeaderName: X-Origin-Verify, Values: [!Ref OriginVerifySecret] }
        - Field: path-pattern
          PathPatternConfig: { Values: ['/api/*'] }
      Actions:
        - { Type: forward, TargetGroupArn: !Ref ApiTargetGroup }

  GameRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 20
      Conditions:
        - Field: http-header
          HttpHeaderConfig: { HttpHeaderName: X-Origin-Verify, Values: [!Ref OriginVerifySecret] }
        - Field: path-pattern
          PathPatternConfig: { Values: ['/ws', '/health', '/ready', '/status'] }
      Actions:
        - { Type: forward, TargetGroupArn: !Ref GameTargetGroup }

  # ---------------------------------------------------------------- ECS
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${Prefix}-cluster'
      ClusterSettings:
        - { Name: containerInsights, Value: enabled } # running/desired task count + CPU per service
      Tags:
        - { Key: purpose, Value: assessment 3 }
        - { Key: qut-username, Value: !Ref QutUsername }

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${Prefix}-game'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      RuntimePlatform: { CpuArchitecture: ARM64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !Ref ExecutionRoleArn
      TaskRoleArn: !Ref TaskRoleArn
      ContainerDefinitions:
        - Name: game
          Image: !Ref ImageUri
          Essential: true
          StopTimeout: 30
          PortMappings: [{ ContainerPort: 8080, Protocol: tcp }]
          Environment:
            - { Name: PORT, Value: '8080' }
            - { Name: SERVICE_NAME, Value: !Sub '${Prefix}-game' }
            - { Name: METRICS_NAMESPACE, Value: n5528712/A3Game }
            - { Name: EVENT_SINK, Value: sqs }
            - { Name: EVENTS_QUEUE_URL, Value: { 'Fn::ImportValue': !Sub '${Prefix}-QueueUrl' } }
            - { Name: SESSION_SECRET_ARN, Value: { 'Fn::ImportValue': !Sub '${Prefix}-SessionSecretArn' } }
            - { Name: TASK_PROTECTION, Value: 'true' }
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
          HealthCheck:
            Command: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
            Interval: 15
            Timeout: 5
            Retries: 3
            StartPeriod: 15
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref GameLogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: game
      Tags:
        - { Key: purpose, Value: assessment 3 }
        - { Key: qut-username, Value: !Ref QutUsername }

  GameService:
    Type: AWS::ECS::Service
    DependsOn: GameRule
    Properties:
      ServiceName: !Sub '${Prefix}-game'
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: !Ref MinTasks
      HealthCheckGracePeriodSeconds: 30
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          # Private subnets, no public IP: the shared SG allows 8080 from anywhere, so the tasks must
          # not be internet-addressable. Only the ALB (inside the VPC) can reach them.
          AssignPublicIp: DISABLED
          Subnets: !Ref PrivateSubnets
          SecurityGroups: [!Ref SecurityGroupId]
      LoadBalancers:
        - { ContainerName: game, ContainerPort: 8080, TargetGroupArn: !Ref GameTargetGroup }
      PropagateTags: SERVICE
      EnableECSManagedTags: true
      Tags:
        - { Key: purpose, Value: assessment 3 }
        - { Key: qut-username, Value: !Ref QutUsername }

  # ---------------------------------------------------------------- ECS Service Auto Scaling
  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub 'service/${Cluster}/${GameService.Name}'
      MinCapacity: !Ref MinTasks
      MaxCapacity: !Ref MaxTasks
      RoleARN: !Sub 'arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService'

  # Primary signal: how full the worlds are. 4 humans per world, so fleet occupancy above the
  # target means new players will soon have nowhere to go.
  OccupancyScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${Prefix}-occupancy-target'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: !Ref OccupancyTarget
        ScaleOutCooldown: 60
        ScaleInCooldown: 180
        CustomizedMetricSpecification:
          Namespace: n5528712/A3Game
          MetricName: WorldOccupancyPct
          Dimensions: [{ Name: ServiceName, Value: !Sub '${Prefix}-game' }]
          Statistic: Average
          Unit: Percent

  # Safety net: simulation CPU (e.g. if a bigger world or more NPCs made a task CPU-bound).
  CpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${Prefix}-cpu-target'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: !Ref CpuTarget
        ScaleOutCooldown: 60
        ScaleInCooldown: 180
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization

Outputs:
  LoadBalancerArn: { Value: !Ref LoadBalancer }
  LoadBalancerDns: { Value: !GetAtt LoadBalancer.DNSName, Export: { Name: !Sub '${Prefix}-AlbDns' } }
  LoadBalancerFullName: { Value: !GetAtt LoadBalancer.LoadBalancerFullName, Export: { Name: !Sub '${Prefix}-AlbFullName' } }
  GameTargetGroupArn: { Value: !Ref GameTargetGroup }
  GameTargetGroupFullName: { Value: !GetAtt GameTargetGroup.TargetGroupFullName, Export: { Name: !Sub '${Prefix}-GameTgFullName' } }
  ApiTargetGroupArn: { Value: !Ref ApiTargetGroup }
  ClusterName: { Value: !Ref Cluster, Export: { Name: !Sub '${Prefix}-ClusterName' } }
  ClusterArn: { Value: !GetAtt Cluster.Arn }
  ServiceName: { Value: !GetAtt GameService.Name, Export: { Name: !Sub '${Prefix}-ServiceName' } }
  ServiceArn: { Value: !Ref GameService }
  TaskDefinitionArn: { Value: !Ref TaskDefinition }
  OccupancyPolicyArn: { Value: !Ref OccupancyScalingPolicy }
  CpuPolicyArn: { Value: !Ref CpuScalingPolicy }
