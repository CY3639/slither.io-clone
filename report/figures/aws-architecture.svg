<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <style>
      .svc{stroke-width:1.5;rx:6}
      .net{fill:#f3ecfb;stroke:#8c4fff}
      .cmp{fill:#fff1e0;stroke:#ed7100}
      .sto{fill:#e9f6ec;stroke:#3f8624}
      .int{fill:#fdeaf1;stroke:#e7157b}
      .db{fill:#e8eefc;stroke:#2e27ad}
      .mgt{fill:#fbe9f5;stroke:#e7157b}
      .sec{fill:#fdecea;stroke:#dd344c}
      .tag{font-size:10px;font-weight:bold;fill:#fff}
      .t{font-weight:bold;text-anchor:middle}
      .s{fill:#444;font-size:10.5px;text-anchor:middle}
      .l{fill:#333;font-size:10.5px}
      .ln{stroke:#333;stroke-width:1.3;fill:none;marker-end:url(#a)}
