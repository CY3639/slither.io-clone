  <text class="s" x="115" y="280">dashboard n5528712-a3</text>
  <text class="s" x="115" y="294">5 alarms</text>
  <rect class="svc sec" x="820" y="560" width="150" height="56"/>
  <text class="t" x="895" y="580">IAM</text><text class="s" x="895" y="595">pre-provisioned CAB432</text><text class="s" x="895" y="608">ECS + Lambda roles</text>
  <text class="l" x="22" y="624" fill="#147eba">IaC: CloudFormation (data · backend · frontend · monitoring) + CLI scripts</text>
